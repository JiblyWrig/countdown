<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Every Second — Countdown to August 27, 9:00 PM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000; --paper:#fff;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink); overflow:hidden;
    font-family:var(--mono); overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  #field{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
  #field.grabbing{cursor:grabbing}

  .hud{position:fixed;z-index:5;pointer-events:none;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .tl{top:clamp(14px,2.5vw,28px);left:clamp(14px,2.5vw,28px);animation-delay:.05s}
  .tr{top:clamp(14px,2.5vw,28px);right:clamp(14px,2.5vw,28px);text-align:right;animation-delay:.15s}
  .br{bottom:clamp(14px,2.5vw,28px);right:clamp(14px,2.5vw,28px);display:flex;gap:6px;pointer-events:auto;animation-delay:.32s}

  .kicker{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;font-weight:500}
  .blink{animation:blink 1s steps(2) infinite}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(22px,4vw,42px);
     letter-spacing:-.015em;line-height:1;margin:8px 0 12px}
  h1 small{font-size:.55em;font-weight:500;letter-spacing:.02em}

  .clock{display:flex;gap:8px}
  .cell{border:1px solid #000;background:#fff;padding:7px 10px 6px;min-width:58px;text-align:center}
  .cell b{display:block;font:700 clamp(18px,2.4vw,28px)/1 var(--mono);font-variant-numeric:tabular-nums}
  .cell i{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.22em;font-style:normal;margin-top:5px;opacity:.6}

  .stat{margin-bottom:12px}
  .stat i{display:block;font:500 9px var(--mono);letter-spacing:.22em;font-style:normal;opacity:.55;margin-bottom:3px}
  .stat b{font:700 clamp(15px,1.9vw,23px)/1.1 var(--mono);font-variant-numeric:tabular-nums}
  .stat.small span{font-size:10px;letter-spacing:.06em}
  .bar{width:190px;height:2px;background:rgba(0,0,0,.12);margin:6px 0 0 auto}
  #bar{height:100%;background:#000;transform-origin:left;transform:scaleX(0)}

  .br button{
    appearance:none;border:1px solid #000;background:#fff;color:#000;cursor:pointer;
    font:700 11px var(--mono);letter-spacing:.14em;padding:10px 13px;
    transition:background .15s,color .15s,transform .06s;
  }
  .br button:hover{background:#000;color:#fff}
  .br button:active{transform:translateY(1px)}
  #zfollow.on{background:#000;color:#fff}
  .fdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;
        margin-right:7px;vertical-align:1px;animation:blink 1s steps(2) infinite}

  #done{position:fixed;inset:0;z-index:10;background:#fff;display:flex;align-items:center;justify-content:center;
        text-align:center;opacity:0;pointer-events:none;transition:opacity 1.6s ease}
  #done.show{opacity:1;pointer-events:auto}
  #done .big{display:block;font:700 clamp(44px,9vw,120px)/.95 var(--disp);letter-spacing:-.02em}
  #done .sub{display:block;margin-top:20px;font:500 clamp(11px,1.4vw,14px) var(--mono);letter-spacing:.3em}

  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (max-width:720px){
    .stat.small{display:none}
    .bar{width:120px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<canvas id="field" role="img" aria-label="A solid black field of seconds counting down to August 27 at 9 PM; zoom in to see individual seconds"></canvas>

<header class="hud tl">
  <div class="kicker"><span class="blink">●</span> COUNTDOWN · TARGET AUG 27 <span id="targetYear"></span> · 21:00 LOCAL</div>
  <h1>AUGUST 27 <small>—</small> 9:00 PM</h1>
  <div class="clock" aria-hidden="true">
    <div class="cell"><b id="dd">··</b><i>DAYS</i></div>
    <div class="cell"><b id="hh">··</b><i>HRS</i></div>
    <div class="cell"><b id="mm">··</b><i>MIN</i></div>
    <div class="cell"><b id="ss">··</b><i>SEC</i></div>
  </div>
</header>

<aside class="hud tr">
  <div class="stat"><i>SECONDS REMAINING</i><b id="remNum">—</b></div>
  <div class="stat"><i>ELAPSED · <span id="pct">0.00%</span></i><div class="bar"><div id="bar"></div></div></div>
  <div class="stat small"><i>FIELD</i><span id="meta">—</span></div>
</aside>

<nav class="hud br">
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zfit" aria-label="Fit field to screen">FIT</button>
  <button id="zfollow" aria-pressed="false"><span class="fdot"></span>FOLLOW</button>
</nav>

<div id="done">
  <div>
    <span class="big">AUGUST 27</span>
    <span class="sub">9:00 PM — IT'S TIME <span class="blink">●</span></span>
  </div>
</div>

<script>
(() => {
'use strict';
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
const $ = id => document.getElementById(id);
const dd=$('dd'), hh=$('hh'), mm=$('mm'), ss=$('ss'), remNum=$('remNum'),
      pctEl=$('pct'), bar=$('bar'), meta=$('meta'), doneEl=$('done'), followBtn=$('zfollow');
const nf = new Intl.NumberFormat('en-US');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const p2 = n => String(n).padStart(2,'0');
const TAU = 6.283185307;
const smooth = t => t*t*(3-2*t);

/* ---------- target: Aug 27, 21:00 local (this year, or next if passed) ---------- */
const boot = new Date();
let target = new Date(boot.getFullYear(), 7, 27, 21, 0, 0);
if (target.getTime() <= boot.getTime()) target = new Date(boot.getFullYear()+1, 7, 27, 21, 0, 0);
const TARGET_MS = target.getTime();
const TOTAL = Math.max(0, Math.round((TARGET_MS - boot.getTime()) / 1000));
$('targetYear').textContent = target.getFullYear();

const FADE = 0.9; // seconds a cell takes to fade at the edge

/* ---------- grid: regenerated from the exact moment you arrive ---------- */
const phase  = ((TOTAL/3600) % 24) / 24;
const aspect = 0.55 + 1.5 * (0.5 - 0.5*Math.cos(phase * TAU));
const cols = Math.max(1, Math.ceil(Math.sqrt(TOTAL * aspect)));
const rows = Math.max(1, Math.ceil(TOTAL / cols));
const GEN = `${p2(boot.getHours())}:${p2(boot.getMinutes())}:${p2(boot.getSeconds())}`;
meta.textContent = `${nf.format(cols)} × ${nf.format(rows)} · GEN ${GEN}`;

/* ---------- camera (critically damped spring, log-space zoom) ---------- */
let vw=0, vh=0, dpr=1, fitS=1;
const cam  = {x:0, y:0, s:1, ls:0};
const camT = {x:0, y:0, s:1, ls:0};
const vel  = {x:0, y:0, ls:0};
const SX = wx => (wx-cam.x)*cam.s + vw/2;
const SY = wy => (wy-cam.y)*cam.s + vh/2;
const computeFit = () => { fitS = Math.min(vw/(cols+8), vh/(rows+8)); };
const clampScale = s => Math.max(fitS*0.5, Math.min(300, s));

function setTargetScale(ns){
  ns = clampScale(ns);
  camT.s = ns; camT.ls = Math.log(ns);
}
function clampT(){
  setTargetScale(camT.s);
  const m = Math.max(4, cols*0.2, rows*0.2);
  camT.x = Math.max(-m, Math.min(cols+m, camT.x));
  camT.y = Math.max(-m, Math.min(rows+m, camT.y));
}
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = innerWidth; vh = innerHeight;
  canvas.width = Math.round(vw*dpr); canvas.height = Math.round(vh*dpr);
  canvas.style.width = vw+'px'; canvas.style.height = vh+'px';
  computeFit(); clampT();
}
addEventListener('resize', resize);
resize();
cam.x = camT.x = cols/2; cam.y = camT.y = rows/2;
setTargetScale(fitS);
cam.ls = Math.log(RM ? fitS : fitS*1.6); cam.s = Math.exp(cam.ls);

function damp(cur, tgt, v, smoothTime, dt){
  const omega = 2/Math.max(1e-4, smoothTime);
  const x = omega*dt;
  const e = 1/(1 + x + 0.48*x*x + 0.235*x*x*x);
  const change = cur - tgt;
  const temp = (v + omega*change)*dt;
  const nv = (v - omega*temp)*e;
  return [tgt + (change + temp)*e, nv];
}

/* ---------- follow mode ---------- */
let follow = false;
const FOLLOW_S = 34;
function setFollow(v){ follow=v; followBtn.classList.toggle('on',v); followBtn.setAttribute('aria-pressed',v); }
function stopFollow(){ if(follow) setFollow(false); }
followBtn.addEventListener('click', () => setFollow(!follow));

/* ---------- zoom / pan input ---------- */
function zoomAt(px, py, f){
  const ns = clampScale(camT.s*f);
  const k = ns/camT.s; if(Math.abs(k-1) < 1e-6) return;
  camT.x += (px-vw/2)/camT.s * (1-1/k);
  camT.y += (py-vh/2)/camT.s * (1-1/k);
  setTargetScale(ns); stopFollow(); clampT();
}
function fitView(){ camT.x=cols/2; camT.y=rows/2; setTargetScale(fitS); stopFollow(); }
$('zin').onclick  = () => zoomAt(vw/2, vh/2, 1.6);
$('zout').onclick = () => zoomAt(vw/2, vh/2, 1/1.6);
$('zfit').onclick = fitView;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const mul = e.deltaMode===1 ? 33 : e.deltaMode===2 ? 120 : 1;
  const dx = e.deltaX*mul, dy = e.deltaY*mul;
  if(e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-dy*0.0108));
  else if(Math.abs(dx) > Math.abs(dy)){
    camT.x += dx/camT.s; camT.y += dy/camT.s; stopFollow(); clampT();
  }
  else zoomAt(e.clientX, e.clientY, Math.exp(-dy*0.0021));
}, {passive:false});

const ptrs = new Map(); let drag=null, pinch=null;
const mouse = {x:0, y:0, in:false};
const pinchState = () => { const [a,b]=[...ptrs.values()];
  return { d: Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2 }; };

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size===1){ drag={x:e.clientX,y:e.clientY,moved:false}; }
  else { drag=null; if(ptrs.size===2) pinch=pinchState(); }
});
canvas.addEventListener('pointermove', e => {
  mouse.x=e.clientX; mouse.y=e.clientY; mouse.in=true;
  const p=ptrs.get(e.pointerId); if(!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2 && pinch){
    const n=pinchState();
    zoomAt(n.mx, n.my, n.d/pinch.d);
    camT.x -= (n.mx-pinch.mx)/camT.s; camT.y -= (n.my-pinch.my)/camT.s;
    pinch=n; clampT();
  } else if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!drag.moved && Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    if(drag.moved){
      camT.x -= dx/camT.s; camT.y -= dy/camT.s;
      drag.x=e.clientX; drag.y=e.clientY;
      stopFollow(); clampT(); canvas.classList.add('grabbing');
    }
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===1){ const [a]=[...ptrs.values()]; drag={x:a.x,y:a.y,moved:true}; }
  if(!ptrs.size){ drag=null; canvas.classList.remove('grabbing'); }
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('pointerleave', () => { mouse.in=false; });
canvas.addEventListener('dblclick', e => zoomAt(e.clientX, e.clientY, 3));

addEventListener('keydown', e => {
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k==='+'||k==='=') zoomAt(vw/2,vh/2,1.5);
  else if(k==='-'||k==='_') zoomAt(vw/2,vh/2,1/1.5);
  else if(k==='0') fitView();
  else if(k==='f'||k==='F') setFollow(!follow);
  else if(k.startsWith('Arrow')){
    const st=90/camT.s;
    if(k==='ArrowLeft')camT.x-=st; else if(k==='ArrowRight')camT.x+=st;
    else if(k==='ArrowUp')camT.y-=st; else camT.y+=st;
    stopFollow(); clampT(); e.preventDefault();
  } else return;
  e.preventDefault();
});

/* ---------- render: solid black field, grid + indices revealed on zoom ---------- */
const GRID_AT = 26;  // spacing where the cell grid fades in
const LABEL_AT = 60; // spacing where index numbers fade in

function draw(e){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,vw,vh);
  if(TOTAL<=0) return hoverOutline();

  const kf=Math.floor(e), ft=e-kf;
  const aliveFrom=Math.min(TOTAL, kf+1);

  /* solid black alive region — always just up to three rectangles */
  ctx.fillStyle='#000';
  if(aliveFrom < TOTAL){
    const r0=(aliveFrom/cols)|0, c0=aliveFrom%cols;
    ctx.fillRect(SX(c0), SY(r0), Math.min(cols-c0, TOTAL-aliveFrom)*cam.s, cam.s);
    const fullH=(rows-1)-(r0+1);
    if(fullH>0) ctx.fillRect(SX(0), SY(r0+1), cols*cam.s, fullH*cam.s);
    if(r0+1<=rows-1) ctx.fillRect(SX(0), SY(rows-1), (TOTAL-(rows-1)*cols)*cam.s, cam.s);
  }
  /* the dying second: a cell fading out at the edge */
  if(kf<TOTAL && ft<FADE){
    ctx.globalAlpha = 1-smooth(ft/FADE);
    ctx.fillRect(SX(kf%cols), SY((kf/cols)|0), cam.s, cam.s);
    ctx.globalAlpha = 1;
  }

  const s=cam.s;
  const L=cam.x-vw/(2*s), T=cam.y-vh/(2*s);
  const R=cam.x+vw/(2*s), B=cam.y+vh/(2*s);

  /* cell grid fades in over the black as you zoom */
  if(s>=GRID_AT){
    const ga=0.22*smooth(Math.min(1,(s-GRID_AT)/8));
    const x0=Math.max(0,Math.floor(L)), x1=Math.min(cols,Math.ceil(R));
    const y0=Math.max(0,Math.floor(T)), y1=Math.min(rows,Math.ceil(B));
    ctx.strokeStyle=`rgba(255,255,255,${ga})`; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=x0;x<=x1;x++){ const px=SX(x); ctx.moveTo(px,SY(y0)); ctx.lineTo(px,SY(y1)); }
    for(let y=y0;y<=y1;y++){ const py=SY(y); ctx.moveTo(SX(x0),py); ctx.lineTo(SX(x1),py); }
    ctx.stroke();
  }

  /* index numbers at deep zoom (white on black, black on white) */
  if(s>=LABEL_AT){
    const la=smooth(Math.min(1,(s-LABEL_AT)/20));
    const fs=Math.max(9,Math.min(13,s*0.15));
    ctx.font=`500 ${fs}px "IBM Plex Mono", monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const x0=Math.max(0,Math.floor(L)), x1=Math.min(cols-1,Math.floor(R));
    const y0=Math.max(0,Math.floor(T)), y1=Math.min(rows-1,Math.floor(B));
    for(let y=y0;y<=y1;y++){
      let idx=y*cols+x0;
      for(let x=x0;x<=x1;x++,idx++){
        if(idx>=TOTAL) break;
        ctx.fillStyle = idx>kf ? `rgba(255,255,255,${0.55*la})` : `rgba(0,0,0,${0.4*la})`;
        ctx.fillText(nf.format(idx), SX(x+0.5), SY(y+0.5));
      }
    }
  }
  hoverOutline();
}

function hoverOutline(){
  if(!(mouse.in && cam.s>=10 && TOTAL>0)) return;
  const wx=cam.x+(mouse.x-vw/2)/cam.s, wy=cam.y+(mouse.y-vh/2)/cam.s;
  const cx=Math.floor(wx), cy=Math.floor(wy);
  if(cx>=0 && cy>=0 && cx<cols && cy<rows){
    const idx=cy*cols+cx;
    if(idx<TOTAL){
      ctx.strokeStyle='rgba(127,127,127,0.9)'; ctx.lineWidth=1;
      ctx.strokeRect(SX(cx)+0.5, SY(cy)+0.5, cam.s-1, cam.s-1);
    }
  }
}

/* ---------- HUD ---------- */
let lastInt=-1, doneShown=false;
function hudTick(e){
  bar.style.transform = `scaleX(${TOTAL ? Math.min(1, e/TOTAL) : 1})`;
  const ei=Math.floor(e);
  if(ei!==lastInt){
    lastInt=ei;
    const left=Math.max(0, Math.ceil((TARGET_MS-Date.now())/1000));
    const d=(left/86400)|0, h=((left%86400)/3600)|0, m=((left%3600)/60)|0, s=left%60;
    dd.textContent=String(d).padStart(2,'0');
    hh.textContent=p2(h); mm.textContent=p2(m); ss.textContent=p2(s);
    remNum.textContent=nf.format(Math.max(0, TOTAL-ei));
    pctEl.textContent=TOTAL ? ((ei/TOTAL)*100).toFixed(2)+'%' : '100.00%';
    document.title = left>0 ? `T–${d}d ${p2(h)}:${p2(m)}:${p2(s)} → Aug 27 · 9PM` : 'AUGUST 27 · 9:00 PM';
  }
  if(!doneShown && (TARGET_MS-Date.now())<=0){
    doneShown=true; setFollow(false); doneEl.classList.add('show');
  }
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const remMs=TARGET_MS-Date.now();
  const e=TOTAL ? Math.max(0, Math.min(TOTAL, TOTAL-remMs/1000)) : 0;
  if(follow && TOTAL>0){
    const kf=Math.min(TOTAL-1, Math.max(0, Math.floor(e)));
    camT.x=kf%cols+0.5; camT.y=((kf/cols)|0)+0.5;
    setTargetScale(FOLLOW_S); clampT();
  }
  if(RM){
    cam.x=camT.x; cam.y=camT.y; cam.ls=camT.ls; cam.s=camT.s;
    vel.x=vel.y=vel.ls=0;
  } else {
    let r;
    r=damp(cam.ls, camT.ls, vel.ls, 0.115, dt); cam.ls=r[0]; vel.ls=r[1]; cam.s=Math.exp(cam.ls);
    r=damp(cam.x,  camT.x,  vel.x,  0.135, dt); cam.x=r[0];  vel.x=r[1];
    r=damp(cam.y,  camT.y,  vel.y,  0.135, dt); cam.y=r[0];  vel.y=r[1];
  }
  draw(e); hudTick(e);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
